# One-time: delete docker-docling-ollama package so docker-docling-ollama repo can create it
# Remove this file after running
name: Delete docker-docling-ollama package

on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-ollama-package.yml']

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete package
        run: |
          resp=$(curl -s -w "%{http_code}" -o /tmp/delete_resp -X DELETE \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/user/packages/container/docker-docling-ollama)
          # 204=deleted, 404=already gone
          [[ "$resp" == "204" || "$resp" == "404" ]] && echo "OK (HTTP $resp)" || (cat /tmp/delete_resp; exit 1)
