name: Build and push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker-docling
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/christhompsontldr/docker-docling:latest

      - name: Build and push docker-docling-ollama
        uses: docker/build-push-action@v6
        with:
          context: ./ollama
          push: true
          tags: ghcr.io/christhompsontldr/docker-docling-ollama:latest
